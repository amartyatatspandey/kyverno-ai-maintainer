A;\n    flex: 1;\n    padding: 18px 16px 18px 16px;\n  }\n  .layer.policy { background: #D9381E; border-color: #D9381E; }\n  .layer .role {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em;\n    text-transform: uppercase; margin-bottom: 8px;\n  }\n  .layer .role .n { color: #D9381E; }\n  .layer.policy .role .n { color: #FFFFFF; }\n  .layer .name {\n    font-weight: 800; font-size: 19px; line-height: 1.25; color: #1A1A1A; margin-bottom: 6px;\n  }\n  .layer .desc {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 13.5px; color: #333333; line-height: 1.45;\n  }\n  .layer.policy .desc { color: #FFFFFF; }\n  .arrow {\n    display: flex; align-items: center; justify-content: center;\n    width: 44px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px; font-weight: 700; color: #1A1A1A;\n  }\n\n  .statement {\n    border: 2px solid #1A1A1A;\n    padding: 18px 26px 20px 26px;\n  }\n  .statement p {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 17px; line-height: 1.6; color: #333333;\n  }\n  .statement p .hl { color: #D9381E; font-weight: 700; }\n  .statement p b { color: #1A1A1A; font-weight: 700; }\n\n  .footer {\n    display: flex; justify-content: space-between; align-items: center;\n    padding: 12px 88px 18px 88px; border-top: 1px solid #E0E0E0; margin-top: 20px;\n  }\n  .footer span { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #999999; letter-spacing: 0.06em; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">04 — Thesis<\/div>\n    <h1>Why not just automate it with a shell script and an LLM?<\/h1>\n\n    <div class=\"failure\">\n      <div class=\"tag\">Failure mode<\/div>\n      <div class=\"body\">\n        <div class=\"stmt\"><b>\"Hand an LLM a GitHub token and a shell\"<\/b> is the obvious approach — and the wrong one. Prompt injection from issue bodies, PR descriptions, and changelogs makes the model an unreliable authority.<\/div>\n        <div class=\"vectors\">\n          <div class=\"v-label\">Injection surfaces<\/div>\n          <div class=\"chip\">issue bodies<\/div>\n          <div class=\"chip\">PR descriptions<\/div>\n          <div class=\"chip\">changelogs<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"answer-label\">The four-layer answer — <span>authorization never trusts the model<\/span><\/div>\n    <div class=\"pipeline\">\n      <div class=\"layer\">\n        <div class=\"role\"><span class=\"n\">01<\/span> Proposes<\/div>\n        <div class=\"name\">LLM<\/div>\n        <div class=\"desc\">advisory only<\/div>\n      <\/div>\n      <div class=\"arrow\">→<\/div>\n      <div class=\"layer policy\">\n        <div class=\"role\"><span class=\"n\">02<\/span> Authorizes<\/div>\n        <div class=\"name\">Deterministic policy engine<\/div>\n        <div class=\"desc\">deny-by-default<\/div>\n      <\/div>\n      <div class=\"arrow\">→<\/div>\n      <div class=\"layer\">\n        <div class=\"role\"><span class=\"n\">03<\/span> Executes<\/div>\n        <div class=\"name\">Sandbox<\/div>\n        <div class=\"desc\">credential-free<\/div>\n      <\/div>\n      <div class=\"arrow\">→<\/div>\n      <div class=\"layer\">\n        <div class=\"role\"><span class=\"n\">04<\/span> Records<\/div>\n        <div class=\"name\">Audit log<\/div>\n        <div class=\"desc\">write-ahead<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"statement\">\n      <p>The model can be <b>wrong<\/b>, be <b>confused<\/b>, or be <b>actively attacked through its inputs<\/b> — <span class=\"hl\">none of that should be able to move a merge button.<\/span><\/p>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>KYVERNO AI MAINTAINER ASSISTANT · LFX MENTORSHIP PROPOSAL<\/span>\n    <span>PAGE 04 / 13<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  .slide-container {\n    width: 1280px;\n    min-height: 720px;\n    background: #FFFFFF;\n    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;\n    color: #1A1A1A;\n    display: flex;\n    flex-direction: column;\n  }\n  .accent-rule { width: 1280px; height: 3px; background: #D9381E; }\n  .inner { padding: 44px 88px 0 88px; flex: 1; display: flex; flex-direction: column; }\n  .kicker {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 14px; font-weight: 500; letter-spacing: 0.12em;\n    color: #1A1A1A; text-transform: uppercase; margin-bottom: 12px;\n  }\n  .kicker::before {\n    content: \"\";\n    display: inline-block;\n    width: 7px;\n    height: 7px;\n    background: #D9381E;\n    margin-right: 10px;\n    vertical-align: middle;\n    margin-bottom: 2px;\n  }\n  h1 { font-weight: 900; font-size: 46px; line-height: 1.02; letter-spacing: -0.015em; margin-bottom: 8px; }\n  .sub {\n    font-size: 16px; font-weight: 600; color: #333333; margin-bottom: 30px;\n  }\n  .sub .mono { font-family: 'JetBrains Mono', monospace; font-size: 15px; }\n\n  /* Pipeline */\n  .pipeline {\n    display: flex;\n    align-items: stretch;\n    border: 2px solid #1A1A1A;\n  }\n  .node {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    align-items: flex-start;\n    padding: 16px 12px 16px 14px;\n    min-height: 128px;\n    border-right: 1px solid #E0E0E0;\n    background: #FFFFFF;\n  }\n  .node:last-child { border-right: none; }\n  .node .tag {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em;\n    text-transform: uppercase; color: #333333;\n    margin-bottom: 8px;\n  }\n  .node .name {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 15px; font-weight: 700; color: #1A1A1A;\n    line-height: 1.25; margin-bottom: 6px;\n  }\n  .node .desc {\n    font-size: 12.5px; line-height: 1.4; color: #333333;\n  }\n  .node .desc .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; }\n  .node.accent {\n    background: #D9381E;\n    border-right: 2px solid #1A1A1A;\n  }\n  .node.accent .tag, .node.accent .name, .node.accent .desc { color: #FFFFFF; }\n  .node.accent .name { font-weight: 700; }\n  .arrow {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    width: 34px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 17px;\n    font-weight: 700;\n    color: #D9381E;\n    background: #FFFFFF;\n    border-right: 1px solid #E0E0E0;\n  }\n\n  /* Audit strip */\n  .audit {\n    margin-top: 16px;\n    border: 2px solid #1A1A1A;\n    display: flex;\n    align-items: stretch;\n  }\n  .audit .side {\n    width: 200px;\n    background: #1A1A1A;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    padding: 14px 16px;\n  }\n  .audit .side .t {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 13px; font-weight: 700; letter-spacing: 0.1em;\n    text-transform: uppercase; color: #F28B7A; margin-bottom: 5px;\n  }\n  .audit .side .d {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12.5px; color: #FFFFFF; line-height: 1.45;\n  }\n  .audit .side .d span { color: #BBBBBB; }\n  .audit .right {\n    flex: 1;\n    display: flex;\n    align-items: center;\n    padding: 14px 22px;\n    background: #FFFFFF;\n  }\n  .audit .right p {\n    font-size: 15.5px; line-height: 1.5; color: #333333;\n  }\n  .audit .right p .mono { font-family: 'JetBrains Mono', monospace; font-size: 14.5px; font-weight: 500; color: #1A1A1A; }\n  .audit .right p b { color: #1A1A1A; font-weight: 700; }\n\n  /* Merge-path label */\n  .mergelabel {\n    margin-top: 22px;\n    border: 2px solid #1A1A1A;\n    display: flex;\n    align-items: center;\n    padding: 16px 26px 18px 26px;\n    gap: 26px;\n  }\n  .mergelabel .big {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 30px; font-weight: 700; color: #1A1A1A;\n    white-space: nowrap;\n  }\n  .mergelabel .big .hl { color: #D9381E; }\n  .mergelabel .exp {\n    font-size: 15px; line-height: 1.5; color: #333333;\n  }\n  .mergelabel .exp .mono { font-family: 'JetBrains Mono', monospace; font-size: 14px; }\n\n  .footer {\n    display: flex; justify-content: space-between; align-items: center;\n    padding: 14px 88px 20px 88px; border-top: 1px solid #E0E0E0; margin-top: 20px;\n  }\n  .footer span { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #999999; letter-spacing: 0.06em; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">05 — Architecture<\/div>\n    <h1>One pipeline. One authorization point.<\/h1>\n    <div class=\"sub\">Reproduces the high-level component flow of <span class=\"mono\">ARCHITECTURE.md<\/span> — each box is a process boundary; only the highlighted step can authorize a merge.<\/div>\n\n    <div class=\"pipeline\">\n      <div class=\"node\">\n        <div class=\"tag\">Trigger<\/div>\n        <div class=\"name\">CLI / runtime<\/div>\n        <div class=\"desc\">Workflow invocation, event routing<\/div>\n      <\/div>\n      <div class=\"arrow\">→<\/div>\n      <div class=\"node\">\n        <div class=\"tag\">Propose<\/div>\n        <div class=\"name\">LLM<\/div>\n        <div class=\"desc\"><span class=\"mono\">BYOM<\/span>: Anthropic / OpenAI / local — advisory only<\/div>\n      <\/div>\n      <div class=\"arrow\">→<\/div>\n      <div class=\"node accent\">\n        <div class=\"tag\">Authorize<\/div>\n        <div class=\"name\">policy engine<\/div>\n        <div class=\"desc\">Evaluate → Decision, deny-by-default<\/div>\n      <\/div>\n      <div class=\"arrow\">→<\/div>\n      <div class=\"node\">\n        <div class=\"tag\">Isolate<\/div>\n        <div class=\"name\">sandbox<\/div>\n        <div class=\"desc\">Docker, network-isolated — runs first<\/div>\n      <\/div>\n      <div class=\"arrow\">→<\/div>\n      <div class=\"node\">\n        <div class=\"tag\">Execute<\/div>\n        <div class=\"name\">executor (ghx)<\/div>\n        <div class=\"desc\">Sole credential holder<\/div>\n      <\/div>\n      <div class=\"arrow\">→<\/div>\n      <div class=\"node\">\n        <div class=\"tag\">Destination<\/div>\n        <div class=\"name\">GitHub<\/div>\n        <div class=\"desc\">Merged or flagged PRs<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"audit\">\n      <div class=\"side\">\n        <div class=\"t\">audit log<\/div>\n        <div class=\"d\">listens to <span>every step<\/span> — write-ahead record<\/div>\n      <\/div>\n      <div class=\"right\">\n        <p>Every proposal, decision, execution and outcome is recorded before the action lands. <b>A post-hoc audit trail is a control, not a feature<\/b> — <span class=\"mono\">no step in the pipeline can skip it.<\/span><\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"mergelabel\">\n      <div class=\"big\"><span class=\"hl\">12+<\/span> tools · <span class=\"hl\">1<\/span> workflow can merge<\/div>\n      <div class=\"exp\">The merge path runs through <span class=\"mono\">policy engine (authorize)<\/span> and <span class=\"mono\">executor (ghx)<\/span> — every other workflow is comment/label only. That single gate is the security design.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>KYVERNO AI MAINTAINER ASSISTANT · LFX MENTORSHIP PROPOSAL<\/span>\n    <span>PAGE 05 / 13<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Architecture — Deep Dive<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#1A1A1A; --ink-soft:#4a4a4a; --paper:#FFFFFF; --line:#1A1A1A;\n    --accent:#D9381E; --accent-soft:#F28B7A;\n    --zone-u:#FBE4E1; --zone-u-line:#c9857a;\n    --zone-s:#FBF0DC; --zone-s-line:#c9ab6b;\n    --zone-t:#E3EFE3; --zone-t-line:#7fa88a;\n    --zone-x:#E1EAF5; --zone-x-line:#7d95c2;\n    --zone-e:#EAE6F0; --zone-e-line:#9787ad;\n    --muted:#8a8a8a;\n  }\n  *{margin:0;padding:0;box-sizing:border-box;}\n  html,body{background:var(--paper);color:var(--ink);font-family:'Archivo','Helvetica Neue',Arial,sans-serif;}\n  html,body{height:100%;}\n  body{display:flex;flex-direction:column; overflow:hidden;}\n\n  header{\n    padding:14px 32px 12px 32px; border-bottom:1px solid #E0E0E0;\n    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; flex-shrink:0;\n  }\n  .htitle{display:flex; flex-direction:column; gap:3px; min-width:0;}\n  .kicker{\n    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:500; letter-spacing:.12em;\n    text-transform:uppercase; color:var(--ink); display:flex; align-items:center; gap:8px;\n  }\n  .kicker .dot{width:6px;height:6px;background:var(--accent);display:inline-block;}\n  h1{font-weight:900; font-size:19px; letter-spacing:-.01em; text-wrap:balance;}\n  .thesis{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); max-width:520px; line-height:1.45; display:none;}\n  .thesis b{color:var(--ink);}\n  @media (min-width:1500px){ .thesis{display:block;} }\n\n  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex-shrink:0;}\n  .tbtn{\n    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:.03em;\n    padding:7px 12px; border:2px solid var(--ink); background:var(--paper); color:var(--ink);\n    cursor:pointer; transition:transform .08s ease, background .12s ease, color .12s ease;\n  }\n  .tbtn:hover{transform:translateY(-1px);}\n  .tbtn:focus-visible{outline:3px solid var(--accent-soft); outline-offset:2px;}\n  .tbtn.active{background:var(--ink); color:#fff;}\n  .tbtn.accent{border-color:var(--accent); color:var(--accent);}\n  .tbtn.accent.active{background:var(--accent); border-color:var(--accent); color:#fff;}\n\n  .zoomgroup{display:flex; align-items:center; gap:0; border:2px solid var(--ink); margin-left:4px;}\n  .zbtn{\n    font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; width:30px; height:30px;\n    border:none; background:#fff; color:var(--ink); cursor:pointer; line-height:1;\n  }\n  .zbtn:hover{background:var(--ink); color:#fff;}\n  .zlabel{\n    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); width:48px; text-align:center;\n    border-left:1px solid var(--ink); border-right:1px solid var(--ink); height:30px; display:flex; align-items:center; justify-content:center;\n  }\n  .zfit{\n    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; height:30px; padding:0 10px;\n    border:none; background:#fff; color:var(--ink); cursor:pointer; border-left:1px solid var(--ink);\n  }\n  .zfit:hover{background:var(--ink); color:#fff;}\n\n  main{flex:1; min-height:0; padding:12px 24px; display:flex;}\n  figure{margin:0; width:100%; display:flex; flex-direction:column; min-height:0;}\n  .canvas-scroll{overflow:auto; border:2px solid var(--ink); background:#fff; flex:1; min-height:0;}\n  .stage-sizer{position:relative; margin:0 auto;}\n  .stage{position:absolute; top:0; left:0; width:1700px; height:1040px; transform-origin:top left;}\n  .stage svg{position:absolute; inset:0; width:1700px; height:1040px; display:block;}\n  figcaption{\n    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);\n    padding:8px 4px 0 4px; line-height:1.5; max-width:1200px; flex-shrink:0;\n  }\n  figcaption b{color:var(--ink);}\n\n  /* node overlay boxes (HTML, positioned to match SVG rects exactly) */\n  .node{\n    position:absolute; display:flex; flex-direction:column; justify-content:center; gap:4px;\n    padding:12px 16px; cursor:pointer; user-select:none;\n  }\n  .node:hover .n-title{text-decoration-thickness:2px;}\n  .node:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}\n  .node .n-eyebrow{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);}\n  .node .n-title{font-weight:800; font-size:15.5px; line-height:1.25; color:var(--ink); text-decoration:underline; text-decoration-color:transparent; text-decoration-thickness:1px; transition:text-decoration-thickness .12s;}\n  .node .n-sub{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); line-height:1.4;}\n  .node .n-badge{\n    position:absolute; top:-9px; right:-9px; width:20px; height:20px; border-radius:50%;\n    background:var(--ink); color:#fff; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;\n    display:flex; align-items:center; justify-content:center; border:2px solid #fff;\n  }\n  .node.gate{padding:9px 14px; cursor:pointer;}\n  .node.gate .n-title{font-size:13px;}\n  .node.big{justify-content:flex-start; padding-top:16px;}\n  .node.tag{cursor:default; opacity:.85;}\n  .node.tag .n-title{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; letter-spacing:.08em;}\n  .node.tag .n-sub{font-size:11.5px;}\n  .node.audit{flex-direction:row; align-items:center; justify-content:space-between; padding:0 22px;}\n  .node.audit .n-title{font-size:13px;}\n\n  /* dim / highlight states for trace toggles */\n  .stage.tracing .traceable{opacity:.16; transition:opacity .18s ease;}\n  .stage.tracing .lit{opacity:1 !important;}\n  .stage.tracing .lit-stroke{stroke-width:4.2 !important;}\n  .stage:not(.tracing) .traceable{opacity:1; transition:opacity .18s ease;}\n\n  .arrow-label{\n    position:absolute; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft);\n    background:#fff; padding:1px 6px; white-space:nowrap; pointer-events:none;\n  }\n  .arrow-label.strong{color:var(--ink); font-weight:600;}\n  .arrow-label.danger{color:var(--accent); font-weight:700;}\n\n  /* drawer */\n  .backdrop{\n    position:fixed; inset:0; background:rgba(26,26,26,.35); opacity:0; pointer-events:none;\n    transition:opacity .18s ease; z-index:20;\n  }\n  .backdrop.open{opacity:1; pointer-events:auto;}\n  .drawer{\n    position:fixed; top:0; right:0; height:100%; width:min(460px, 92vw); background:#fff;\n    border-left:2px solid var(--ink); transform:translateX(100%); transition:transform .22s ease;\n    z-index:21; display:flex; flex-direction:column;\n  }\n  .drawer.open{transform:translateX(0);}\n  .drawer-head{\n    padding:20px 24px 16px 24px; border-bottom:1px solid #E0E0E0; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;\n  }\n  .drawer-head .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}\n  .drawer-head h2{font-size:20px; font-weight:800; line-height:1.25;}\n  .drawer-close{\n    font-family:'JetBrains Mono',monospace; border:2px solid var(--ink); background:#fff; width:32px; height:32px;\n    cursor:pointer; font-size:15px; line-height:1; flex-shrink:0;\n  }\n  .drawer-close:hover{background:var(--ink); color:#fff;}\n  .drawer-body{padding:20px 24px 32px 24px; overflow-y:auto; font-size:14px; line-height:1.65; color:var(--ink-soft);}\n  .drawer-body p{margin-bottom:14px;}\n  .drawer-body b, .drawer-body strong{color:var(--ink);}\n  .drawer-body code, .drawer-body .mono{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink); background:#F4F4F4; padding:1px 5px;}\n  .drawer-body ul{margin:0 0 14px 18px;}\n  .drawer-body li{margin-bottom:8px;}\n  .drawer-body h3{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px 0; color:var(--ink);}\n  .drawer-body table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:14px;}\n  .drawer-body th, .drawer-body td{border:1px solid #E0E0E0; padding:7px 9px; text-align:left; vertical-align:top;}\n  .drawer-body th{font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink);}\n  .callout{border:2px solid var(--ink); padding:12px 14px; margin-bottom:14px; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.6;}\n  .callout.hot{border-color:var(--accent); color:var(--accent);}\n  .qa{border:1px solid #E0E0E0; padding:12px 14px; margin-bottom:12px;}\n  .qa .q{font-weight:800; color:var(--ink); font-size:13.5px; margin-bottom:6px;}\n\n  footer{padding:8px 24px; border-top:1px solid #E0E0E0; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted); display:flex; justify-content:space-between; flex-shrink:0;}\n\n  @media (prefers-reduced-motion: reduce){\n    *{transition:none !important;}\n  }\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <div class=\"htitle\">\n    <div class=\"kicker\"><span class=\"dot\"><\/span>Architecture — companion to Slide 5<\/div>\n    <h1>One pipeline. Five trust zones. Two authorization gates.<\/h1>\n    <div class=\"thesis\">Trust decreases toward the top of this page. Nothing in a higher-distrust zone can <b>direct<\/b> anything in a lower one — content only crosses a boundary as data that deterministic code parses. Click any box for the mechanism behind it.<\/div>\n  <\/div>\n  <div class=\"toolbar\">\n    <button class=\"tbtn\" id=\"btn-reset\">Reset<\/button>\n    <button class=\"tbtn accent\" id=\"btn-trace-injection\">Trace: injection attempt<\/button>\n    <button class=\"tbtn accent\" id=\"btn-trace-merge\">Trace: authorized merge<\/button>\n    <button class=\"tbtn\" id=\"btn-boundary\">Boundary rules<\/button>\n    <button class=\"tbtn\" id=\"btn-override\">Human override<\/button>\n    <button class=\"tbtn\" id=\"btn-objections\">Objections<\/button>\n    <div class=\"zoomgroup\">\n      <button class=\"zbtn\" id=\"zoom-out\" aria-label=\"Zoom out\">−<\/button>\n      <span class=\"zlabel\" id=\"zoom-label\">100%<\/span>\n      <button class=\"zbtn\" id=\"zoom-in\" aria-label=\"Zoom in\">+<\/button>\n      <button class=\"zfit\" id=\"zoom-fit\">Fit<\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main>\n  <figure>\n    <div class=\"canvas-scroll\" id=\"canvasScroll\">\n      <div class=\"stage-sizer\" id=\"stageSizer\">\n      <div class=\"stage\" id=\"stage\">\n        <svg viewBox=\"0 0 1700 1040\" role=\"img\" aria-label=\"Five trust zones — untrusted content, the LLM, the trusted deterministic core, the sandbox, and external authority — with the two policy-engine gates that sit between the sandbox and a GitHub merge.\">\n          <defs>\n            <filter id=\"roughen\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">\n              <feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"4\" result=\"n\"/>\n              <feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"3.2\"/>\n            <\/filter>\n            <filter id=\"roughen-line\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">\n              <feTurbulence type=\"fractalNoise\" baseFrequency=\"0.03\" numOctaves=\"1\" seed=\"7\" result=\"n2\"/>\n              <feDisplacementMap in=\"SourceGraphic\" in2=\"n2\" scale=\"2.4\"/>\n            <\/filter>\n            <marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n              <path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/>\n            <\/marker>\n          <\/defs>\n\n          <!-- zone bands -->\n          <g font-family=\"JetBrains Mono, monospace\">\n            <rect x=\"0\" y=\"0\" width=\"1700\" height=\"170\" fill=\"var(--zone-u)\"/>\n            <rect x=\"0\" y=\"170\" width=\"1700\" height=\"180\" fill=\"var(--zone-s)\"/>\n            <rect x=\"0\" y=\"350\" width=\"1700\" height=\"340\" fill=\"var(--zone-t)\"/>\n            <rect x=\"0\" y=\"690\" width=\"1700\" height=\"150\" fill=\"var(--zone-x)\"/>\n            <rect x=\"0\" y=\"840\" width=\"1700\" height=\"200\" fill=\"var(--zone-e)\"/>\n            <line x1=\"0\" y1=\"170\" x2=\"1700\" y2=\"170\" stroke=\"#c9857a\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n            <line x1=\"0\" y1=\"350\" x2=\"1700\" y2=\"350\" stroke=\"#c9ab6b\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n            <line x1=\"0\" y1=\"690\" x2=\"1700\" y2=\"690\" stroke=\"#7fa88a\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n            <line x1=\"0\" y1=\"840\" x2=\"1700\" y2=\"840\" stroke=\"#7d95c2\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n            <text x=\"14\" y=\"20\" font-size=\"10.5\" font-weight=\"700\" letter-spacing=\"1.2\" fill=\"#a8635a\">ZONE U — UNTRUSTED (max distrust)<\/text>\n            <text x=\"14\" y=\"190\" font-size=\"10.5\" font-weight=\"700\" letter-spacing=\"1.2\" fill=\"#a1863f\">ZONE S — SEMI-TRUSTED (proposes, cannot authorize)<\/text>\n            <text x=\"14\" y=\"366\" font-size=\"10.5\" font-weight=\"700\" letter-spacing=\"1.2\" fill=\"#4d7a5b\">ZONE T — TRUSTED DETERMINISTIC CORE<\/text>\n            <text x=\"14\" y=\"710\" font-size=\"10.5\" font-weight=\"700\" letter-spacing=\"1.2\" fill=\"#4a5f8c\">ZONE X — SANDBOXED EXECUTION<\/text>\n            <text x=\"14\" y=\"860\" font-size=\"10.5\" font-weight=\"700\" letter-spacing=\"1.2\" fill=\"#6b5a80\">ZONE E — EXTERNAL AUTHORITY (final backstop)<\/text>\n          <\/g>\n\n          <!-- arrows: generated by JS into this group -->\n          <g id=\"arrows\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"><\/g>\n\n          <!-- node boxes: generated by JS into this group -->\n          <g id=\"boxes\"><\/g>\n        <\/svg>\n\n        <!-- HTML overlays: generated by JS, positioned to match the SVG boxes exactly -->\n        <div id=\"overlay\" style=\"position:absolute; inset:0;\"><\/div>\n      <\/div>\n      <\/div>\n    <\/div>\n    <figcaption>\n      This is the complete map of every actor that can talk to GitHub or the sandbox, redrawn from <b>ARCHITECTURE.md<\/b> and <b>TRUST_MODEL.md<\/b> — not a simplified version of it. Solid black arrows are the primary authorized path; thin dashed arrows are the structured-facts and audit taps; the dotted line from GitHub back to the policy engine is the platform-level backstop that holds even if every layer above it has a bug.\n    <\/figcaption>\n  <\/figure>\n<\/main>\n\n<footer>\n  <span>KYVERNO AI MAINTAINER ASSISTANT — ARCHITECTURE DEEP DIVE<\/span>\n  <span>PAGE 06 / 13 · companion to slide 5<\/span>\n<\/footer>\n\n<div class=\"backdrop\" id=\"backdrop\"><\/div>\n<div class=\"drawer\" id=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"drawer-title\">\n  <div class=\"drawer-head\">\n    <div>\n      <div class=\"eyebrow\" id=\"drawer-eyebrow\">Detail<\/div>\n      <h2 id=\"drawer-title\">—<\/h2>\n    <\/div>\n    <button class=\"drawer-close\" id=\"drawer-close\" aria-label=\"Close\">✕<\/button>\n  <\/div>\n  <div class=\"drawer-body\" id=\"drawer-body\"><\/div>\n<\/div>\n\n<script>\n/* ---------- data: nodes ---------- */\nconst NODES = [\n  // Zone U\n  {id:'src-issue', x:40,y:30,w:320,h:110, zone:'u', eyebrow:'Zone U', title:'Issue bodies + repro YAML', sub:'issue authors — max-distrust input', trace:['injection']},\n  {id:'src-pr', x:400,y:30,w:320,h:110, zone:'u', eyebrow:'Zone U', title:'PR bodies, comments, fork code', sub:'repo contributors', trace:['injection']},\n  {id:'src-changelog', x:760,y:30,w:320,h:110, zone:'u', eyebrow:'Zone U', title:'Dependency changelogs & release notes', sub:'fetched text, third-party', trace:[]},\n  {id:'tag-u', x:1120,y:30,w:540,h:110, zone:'u', tag:true, title:'Rule: data, never instructions', sub:'Nothing here is executed or obeyed — it enters the LLM only wrapped and labeled as quoted data.'},\n\n  // Zone S\n  {id:'llm', x:160,y:200,w:480,h:120, zone:'s', eyebrow:'Zone S · proposes', title:'LLM — BYOM', sub:'Anthropic / OpenAI / local · advisory only', trace:['injection'], detail:'llm'},\n  {id:'runtime', x:720,y:200,w:480,h:120, zone:'s', eyebrow:'Zone S · proposes', title:'Agent runtime', sub:'planning loop, budgets, retries', trace:['injection'], detail:'runtime'},\n  {id:'tag-s', x:1280,y:200,w:380,h:120, zone:'s', tag:true, title:'Rule: propose ≠ authorize', sub:'This zone can request a tool. It cannot grant itself the answer.'},\n\n  // Zone T\n  {id:'mcp', x:60,y:375,w:380,h:110, zone:'t', eyebrow:'Zone T', title:'MCP tool layer', sub:'12 tools, schema-validated — 3 mutate', trace:['injection','merge'], detail:'mcp'},\n  {id:'executor', x:60,y:505,w:380,h:100, zone:'t', eyebrow:'Zone T', title:'executor (ghx)', sub:'sole credential holder', trace:['merge'], detail:'executor'},\n  {id:'policy', x:500,y:375,w:520,h:250, zone:'t', eyebrow:'Zone T · Evaluate(action, context) → Decision', title:'Policy engine — deny-by-default', sub:'', big:true, trace:['injection','merge'], detail:'policy'},\n  {id:'gate1', x:525,y:430,w:470,h:85, zone:'t', gate:true, title:'GATE 1 — run_scoped_tests', sub:'authorizes the sandbox, before it runs', trace:['merge'], detail:'gate1'},\n  {id:'gate2', x:525,y:525,w:470,h:85, zone:'t', gate:true, title:'GATE 2 — merge_pr (fresh-refetch + SHA-bind)', sub:'authorizes GitHub, after the sandbox', trace:['merge'], detail:'gate2'},\n  {id:'tag-t', x:1080,y:375,w:560,h:110, zone:'t', tag:true, title:'Rule: nothing here takes direction', sub:'The policy engine only answers. It never initiates, and no LLM output can override a Decision.'},\n  {id:'audit', x:60,y:635,w:1580,h:45, zone:'t', eyebrow:'', title:'Audit log — write-ahead JSONL, listens to every step', sub:'', audit:true, trace:['merge'], detail:'audit'},\n\n  // Zone X\n  {id:'sandbox', x:610,y:710,w:480,h:100, zone:'x', eyebrow:'Zone X', title:'Sandbox — ephemeral Docker container', sub:'credential-free, network-isolated', trace:['merge'], detail:'sandbox'},\n\n  // Zone E\n  {id:'github', x:140,y:880,w:560,h:130, zone:'e', eyebrow:'Zone E', title:'GitHub', sub:'branch protection, App scopes, required checks', trace:['merge'], detail:'github'},\n  {id:'human', x:880,y:880,w:560,h:130, zone:'e', eyebrow:'Zone E', title:'Human maintainers', sub:'kill switch, hold label, revert', trace:[], detail:'human'},\n];\n\n/* ---------- data: arrows (polyline waypoints) ---------- */\nconst ARROWS = [\n  {id:'a1', pts:[[200,140],[220,200]], label:'data only', style:'danger', trace:['injection'], labelPos:[130,175]},\n  {id:'a2', pts:[[560,140],[400,200]], label:'data only', style:'danger', trace:['injection'], labelPos:[500,175]},\n  {id:'a3', pts:[[920,140],[580,200]], label:'quoted text', style:'muted', trace:[], labelPos:[760,168]},\n\n  {id:'a4', pts:[[640,260],[720,260]], label:'propose / advisory', style:'strong', trace:['injection'], labelPos:[645,244]},\n  {id:'a5', pts:[[960,320],[960,345],[250,345],[250,375]], label:'tool calls', style:'strong', trace:['injection'], labelPos:[600,330]},\n\n  {id:'a20', pts:[[500,880],[35,880],[35,430],[60,430]], label:'read: PR facts, diff, checks — structured, deterministic', style:'muted-dash', trace:['merge'], labelPos:[45,600], vertical:true},\n\n  {id:'a6', pts:[[440,430],[500,452]], label:'mutating request', style:'strong', trace:['injection','merge'], labelPos:[356,412]},\n\n  {id:'a7', pts:[[525,472],[460,472],[460,540],[440,540]], label:'ALLOW: run tests (template + caps)', style:'strong', trace:['merge'], labelPos:[330,455]},\n  {id:'a10', pts:[[440,555],[525,567]], label:'Evaluate(merge_pr) fresh-refetch', style:'strong', trace:['merge'], labelPos:[430,538]},\n  {id:'a11', pts:[[525,588],[440,600]], label:'ALLOW bound to SHA / DENY+trace', style:'strong', trace:['merge'], labelPos:[350,608]},\n\n  {id:'a8', pts:[[250,605],[250,660],[850,660],[850,710]], label:'run tests — no creds, no net', style:'strong', trace:['merge'], labelPos:[520,672]},\n  {id:'a9', pts:[[870,710],[870,662],[270,662],[270,605]], label:'results: exit codes, parsed reports', style:'muted-dash', trace:['merge'], labelPos:[520,650]},\n\n  {id:'a12', pts:[[350,605],[350,850],[420,850],[420,880]], label:'merge / comment / set_labels', style:'strong', trace:['merge'], labelPos:[356,760], vertical:true},\n\n  {id:'a14', pts:[[60,430],[20,430],[20,657],[60,657]], label:'every event', style:'muted-dash', trace:['merge'], labelPos:[-20,540], vertical:true},\n  {id:'a15', pts:[[760,625],[760,635]], label:'full rule trace', style:'muted-dash', trace:['merge'], labelPos:[770,616]},\n  {id:'a16', pts:[[150,605],[150,635]], label:'action executed', style:'muted-dash', trace:['merge'], labelPos:[-40,613]},\n\n  {id:'a17', pts:[[1000,890],[1660,890],[1660,420],[1020,420]], label:'config, kill switch, overrides', style:'muted', trace:[], labelPos:[1560,650], vertical:true},\n  {id:'a18', pts:[[880,945],[700,945]], label:'revert, suspend app', style:'muted', trace:[], labelPos:[700,928]},\n  {id:'a19', pts:[[300,880],[15,880],[15,340],[650,340],[650,375]], label:'enforces scopes regardless of any bug above', style:'dotted', trace:[], labelPos:[-30,600], vertical:true},\n];\n\nconst STYLES = {\n  strong:{stroke:'var(--ink)', width:2.4, dash:'none', labelClass:'strong'},\n  danger:{stroke:'var(--accent)', width:2.4, dash:'none', labelClass:'danger'},\n  muted:{stroke:'#9a9a9a', width:1.6, dash:'none', labelClass:''},\n  'muted-dash':{stroke:'#9a9a9a', width:1.6, dash:'5 5', labelClass:''},\n  dotted:{stroke:'var(--accent-soft)', width:1.8, dash:'1 6', labelClass:'danger'},\n};\n\n/* ---------- render ---------- */\nconst svgNS = 'http://www.w3.org/2000/svg';\nconst boxesG = document.getElementById('boxes');\nconst arrowsG = document.getElementById('arrows');\nconst overlay = document.getElementById('overlay');\nconst stage = document.getElementById('stage');\n\nconst ZONE_FILL = {u:'#f6cfc9', s:'#f2e3bd', t:'#c9ddc9', x:'#c7d5ea', e:'#d9d2e5'};\n\nNODES.forEach(n=>{\n  const rect = document.createElementNS(svgNS,'rect');\n  rect.setAttribute('x', n.x); rect.setAttribute('y', n.y);\n  rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);\n  rect.setAttribute('rx', n.tag ? 2 : 6);\n  rect.setAttribute('fill', n.tag ? 'none' : (n.gate ? '#ffffff' : ZONE_FILL[n.zone]));\n  rect.setAttribute('stroke', 'var(--ink)');\n  rect.setAttribute('stroke-width', n.gate ? 1.6 : (n.tag ? 1.4 : 2.2));\n  if(n.tag) rect.setAttribute('stroke-dasharray','4 4');\n  rect.setAttribute('filter','url(#roughen)');\n  rect.setAttribute('data-node', n.id);\n  rect.classList.add('traceable');\n  if(n.trace && n.trace.length) rect.dataset.trace = n.trace.join(',');\n  boxesG.appendChild(rect);\n\n  const div = document.createElement('div');\n  div.className = 'node' + (n.gate?' gate':'') + (n.tag?' tag':'') + (n.audit?' audit':'') + (n.big?' big':'') + ' traceable';\n  div.style.left = n.x+'px'; div.style.top = n.y+'px'; div.style.width = n.w+'px'; div.style.height = n.h+'px';\n  if(n.trace && n.trace.length) div.dataset.trace = n.trace.join(',');\n  div.innerHTML = (n.eyebrow ? `<div class=\"n-eyebrow\">${n.eyebrow}<\/div>` : '') +\n    `<div class=\"n-title\">${n.title}<\/div>` + (n.sub ? `<div class=\"n-sub\">${n.sub}<\/div>` : '');\n  if(n.detail){\n    div.tabIndex = 0;\n    div.setAttribute('role','button');\n    div.addEventListener('click', ()=>openDrawer(n.detail));\n    div.addEventListener('keypress', e=>{ if(e.key==='Enter') openDrawer(n.detail); });\n    const badge = document.createElement('div');\n    badge.className='n-badge'; badge.textContent='+';\n    div.appendChild(badge);\n  }\n  overlay.appendChild(div);\n});\n\nARROWS.forEach(a=>{\n  const st = STYLES[a.style];\n  const pl = document.createElementNS(svgNS,'polyline');\n  pl.setAttribute('points', a.pts.map(p=>p.join(',')).join(' '));\n  pl.setAttribute('fill','none');\n  pl.setAttribute('stroke', st.stroke);\n  pl.setAttribute('stroke-width', st.width);\n  if(st.dash!=='none') pl.setAttribute('stroke-dasharray', st.dash);\n  pl.setAttribute('marker-end','url(#arrow)');\n  pl.setAttribute('filter','url(#roughen-line)');\n  pl.style.color = st.stroke;\n  pl.classList.add('traceable');\n  if(a.trace && a.trace.length) pl.dataset.trace = a.trace.join(',');\n  arrowsG.appendChild(pl);\n\n  const lab = document.createElement('div');\n  lab.className = 'arrow-label' + (st.labelClass ? ' '+st.labelClass : '') + ' traceable';\n  lab.style.left = a.labelPos[0]+'px'; lab.style.top = a.labelPos[1]+'px';\n  if(a.vertical) lab.style.maxWidth = '150px';\n  lab.textContent = a.label;\n  if(a.trace && a.trace.length) lab.dataset.trace = a.trace.join(',');\n  overlay.appendChild(lab);\n});\n\n/* ---------- trace toggles ---------- */\nlet activeTrace = null;\nfunction setTrace(name){\n  activeTrace = (activeTrace===name) ? null : name;\n  stage.classList.toggle('tracing', !!activeTrace);\n  document.querySelectorAll('.traceable').forEach(el=>{\n    const t = (el.dataset.trace||'').split(',');\n    el.classList.toggle('lit', !!activeTrace && t.includes(activeTrace));\n  });\n  document.getElementById('btn-trace-injection').classList.toggle('active', activeTrace==='injection');\n  document.getElementById('btn-trace-merge').classList.toggle('active', activeTrace==='merge');\n}\ndocument.getElementById('btn-trace-injection').addEventListener('click',()=>setTrace('injection'));\ndocument.getElementById('btn-trace-merge').addEventListener('click',()=>setTrace('merge'));\ndocument.getElementById('btn-reset').addEventListener('click',()=>{ activeTrace=null; stage.classList.remove('tracing');\n  document.querySelectorAll('.lit').forEach(el=>el.classList.remove('lit'));\n  document.getElementById('btn-trace-injection').classList.remove('active');\n  document.getElementById('btn-trace-merge').classList.remove('active');\n});\n\n/* ---------- drawer content ---------- */\nconst DETAILS = {\n  llm: {eyebrow:'Zone S — proposes', title:'LLM — advisory only', body:`\n    <p>Any provider, bring-your-own-model: <span class=\"mono\">Anthropic / OpenAI / local<\/span>. Tests and CI pin a deterministic stub so every run is reproducible.<\/p>\n    <p>Untrusted text — issue bodies, PR bodies, changelogs — enters its context only wrapped and labeled as <b>quoted data<\/b>. Nothing in it is executed or obeyed.<\/p>\n    <p>Its output can only ever become a <b>proposal<\/b>: a risk-summary string, a classification guess, or a request to widen (never narrow) a test selection.<\/p>\n    <div class=\"callout hot\">Worst case, provider fully compromised: it can emit misleading advisory text and burn its own rate-limited action budget on allowlisted, revertible actions. It cannot merge a major bump, touch a protected ref, or reach a credential.<\/div>\n  `},\n  runtime: {eyebrow:'Zone S — proposes', title:'Agent runtime', body:`\n    <p>Controls the planning loop: order and selection of tool calls, retries, when a run aborts.<\/p>\n    <h3>Cannot touch<\/h3>\n    <ul>\n      <li>Policy rules<\/li>\n      <li>GitHub credentials — held only by the executor<\/li>\n      <li>Sandbox internals<\/li>\n      <li>Its own budget limits<\/li>\n    <\/ul>\n  `},\n  mcp: {eyebrow:'Zone T', title:'MCP tool layer', body:`\n    <p><b>12 tools total. Only 3 mutate:<\/b> <span class=\"mono\">comment<\/span>, <span class=\"mono\">set_labels<\/span>, <span class=\"mono\">merge_pr<\/span>.<\/p>\n    <p>No push / close / approve / shell tool exists at all — structurally, not by permission check. A tool that isn't exposed can't be requested, no matter what the model asks for.<\/p>\n    <p>Every mutating call is routed through the policy engine before anything happens; every call — mutating or not — is written to the audit log.<\/p>\n  `},\n  executor: {eyebrow:'Zone T', title:'executor (ghx) — sole credential holder', body:`\n    <p>The GitHub client is constructed <b>only inside this process<\/b>. No other code path in the system holds a token.<\/p>\n    <p>It is also the only thing that clones the repo — public HTTPS, pinned to the run's target SHA — before bind-mounting it read-only into the sandbox. The sandbox itself never sees a credential.<\/p>\n    <p>It re-checks the kill switch immediately before <i>every<\/i> side effect, not just once at the top of the run.<\/p>\n  `},\n  policy: {eyebrow:'Zone T', title:'Policy engine — deny-by-default', body:`\n    <p>One entrypoint: <span class=\"mono\">Evaluate(action, context) → Decision<\/span>. Zero-value <span class=\"mono\">Decision<\/span> is a denial. Unknown action type ⇒ deny. Unknown workflow ⇒ deny. Config parse error ⇒ global halt.<\/p>\n    <p><b>Fetch-fresh rule:<\/b> context is assembled fresh by the engine itself, every single call — it re-reads checks, labels, and head SHA right before deciding, never from something the runtime cached minutes earlier.<\/p>\n    <p><b>SHA-binding:<\/b> a Decision is valid only for one head SHA and carries a short TTL. If the SHA changes or the TTL expires before the executor acts, it must re-call Evaluate. This defeats a time-of-check/time-of-use race — a maintainer pushing a new commit between decision and merge can't get an ALLOW for code the policy never actually saw.<\/p>\n    <h3>Rule order (fixed, first DENY wins)<\/h3>\n    <ul>\n      <li>Config valid → else global halt<\/li>\n      <li>Enabled ∧ workflow enabled ∧ kill switch off<\/li>\n      <li>Action ∈ allowed ops for this workflow<\/li>\n      <li>Branch rules (merge target allowlist)<\/li>\n      <li><b>Protected paths<\/b> — overrides everything below it<\/li>\n      <li>Action-specific conditions<\/li>\n      <li>Security-sensitive escalation<\/li>\n      <li>Rate limits<\/li>\n      <li>Freshness / SHA-binding<\/li>\n    <\/ul>\n    <div class=\"callout\">Why the ordering is load-bearing: protected_paths is checked <b>before<\/b> the file-allowlist rule, so a GitHub Actions workflow-pin bump gets flagged for a human even though its changed files would otherwise pass the allowlist. That's PR #17118 from the live demo.<\/div>\n    <p>Deliberately plain Go, not OPA/Rego — the ruleset is ~10 predicates over one context object, and the hard guarantees (fetch-fresh, SHA-binding, fail-closed wiring) live in Go regardless of policy language. <span class=\"mono\">Evaluate(action, ctx)<\/span> is OPA-shaped on purpose: a drop-in Rego engine is a later option, not a rewrite.<\/p>\n  `},\n  gate1: {eyebrow:'Policy — first call', title:'GATE 1 — run_scoped_tests', body:`\n    <p>The first <span class=\"mono\">Evaluate()<\/span> call of a run. Authorizes <i>which package/suite templates<\/i> the sandbox may execute — not a merge decision.<\/p>\n    <p>ALLOW here hands the executor a fixed command template plus resource caps — never a free-form shell string. There is no path from model output to an arbitrary command.<\/p>\n  `},\n  gate2: {eyebrow:'Policy — second call', title:'GATE 2 — merge_pr', body:`\n    <p>The second <span class=\"mono\">Evaluate()<\/span> call, run <i>after<\/i> the sandbox returns, using facts re-fetched at this exact moment: required checks, labels, mergeable state, head SHA.<\/p>\n    <p>This is the gate that actually authorizes a GitHub mutation. ALLOW is bound to the SHA it just fetched; DENY carries the full rule trace, and the run still comments and labels for a human instead of doing nothing silently.<\/p>\n    <div class=\"callout\">Two independent Evaluate() calls, not one — a PR can pass every rule at gate 1 and still be denied at gate 2 if something changed underneath it while the sandbox was running.<\/div>\n  `},\n  sandbox: {eyebrow:'Zone X', title:'Sandbox — ephemeral Docker container', body:`\n    <p>One container per run. No GitHub token, no gitconfig, no env secrets inside — by construction, there is nothing to inject.<\/p>\n    <p><b>Unit-test runs:<\/b> <span class=\"mono\">--network=none<\/span>. Dependencies are pre-baked into the image, so zero egress is needed at all.<\/p>\n    <h3>Resource caps<\/h3>\n    <ul>\n      <li>4 CPU, 8 GiB memory, no swap<\/li>\n      <li>2048 PIDs — fork-bomb guard<\/li>\n      <li>per-command wall-clock timeout<\/li>\n      <li>logs truncated at 1 MiB before anything leaves the sandbox<\/li>\n    <\/ul>\n    <div class=\"callout hot\">Honest compromise: cluster runs (chainsaw suites, issue-repro) need Docker-in-Docker for KinD, which requires <span class=\"mono\">--privileged<\/span>. Two compensations: the sandbox still holds zero credentials, so an escape is compute abuse, not data/repo compromise — and on a dev host, Docker Desktop already interposes a utility VM, so \"escape\" lands in a disposable VM, not the host OS. Named roadmap fix: VM-per-run isolation removes the privileged requirement entirely.<\/div>\n    <p>Cleanup runs in <span class=\"mono\">defer<\/span> regardless of outcome; an orphan-reaper removes anything still labeled <span class=\"mono\">ai-maintainer-run=*<\/span> past the global time cap — covers executor crashes too.<\/p>\n  `},\n  audit: {eyebrow:'Zone T', title:'Audit log — write-ahead JSONL', body:`\n    <p>Every event is appended to <span class=\"mono\">events.jsonl<\/span> <b>before<\/b> the thing it describes executes. A mutating action with no prior audit event is treated as a bug — the executor enforces against it, it isn't just a logging convention.<\/p>\n    <p>Every event passes a secrets scrubber first: regex patterns for GitHub token shapes, <span class=\"mono\">Authorization<\/span> headers, provider API-key shapes, plus exact-match redaction of the process's own live token values.<\/p>\n    <p><span class=\"mono\">assistant audit show &lt;run_id&gt;<\/span> and <span class=\"mono\">assistant audit why pr/N<\/span> read this exact same event stream — there's no separate \"explain yourself\" store to keep in sync.<\/p>\n    <h3>Honestly, not yet<\/h3>\n    <p>Hash-chained tamper-evidence, shipped external storage, and dashboards are all roadmap, not shipped. Today it's local, mutable JSONL — conceded, not hidden.<\/p>\n  `},\n  github: {eyebrow:'Zone E', title:'GitHub — the platform backstop', body:`\n    <p>The App installation grants: <span class=\"mono\">metadata:read<\/span>, <span class=\"mono\">contents:read+write<\/span> (merge needs it), <span class=\"mono\">issues:write<\/span>, <span class=\"mono\">pull_requests:write<\/span>, <span class=\"mono\">checks:read<\/span>.<\/p>\n    <p>It explicitly does <b>not<\/b> get: admin, <span class=\"mono\">workflows:write<\/span>, or secrets.<\/p>\n    <div class=\"callout hot\"><span class=\"mono\">contents:write<\/span> is the App's single broadest grant — the permission a reviewer should probe hardest. Mitigated by branch protection on main/release-* (configured independently on the fork) plus the policy layer sitting in front of every use of it.<\/div>\n    <p>Branch protection enforces its limits regardless of any bug in the code above it — this is the real backstop, not a courtesy check.<\/p>\n  `},\n  human: {eyebrow:'Zone E', title:'Human maintainers', body:`\n    <p>Policy config (<span class=\"mono\">ai-maintainer.yaml<\/span>) is human-owned — changing a rule requires a commit, i.e. maintainer review. The assistant reads it fresh from the target repo's default branch at the start of every run.<\/p>\n    <p>See the <b>Human override<\/b> button above for the full stop/undo surface and latencies.<\/p>\n  `},\n};\n\nconst BOUNDARY_HTML = `\n  <p>Trust decreases from the trusted deterministic core outward to raw untrusted text. Content only crosses a boundary as <b>data<\/b> that deterministic code parses — never as an instruction something obeys.<\/p>\n  <div class=\"qa\"><div class=\"q\">1 · Untrusted → Semi-trusted<\/div>Untrusted text enters the LLM's context only wrapped and labeled as quoted data. Nothing in it is executed or obeyed.<\/div>\n  <div class=\"qa\"><div class=\"q\">2 · Semi-trusted → Trusted<\/div>The agent can only <i>request<\/i> tools. Every mutating request produces a policy Decision bound to fresh state and the head SHA.<\/div>\n  <div class=\"qa\"><div class=\"q\">3 · Trusted → Sandboxed<\/div>Only allowlisted, parameterized commands enter the sandbox. No credentials ever cross this boundary.<\/div>\n  <div class=\"qa\"><div class=\"q\">4 · Sandboxed → Trusted<\/div>Only structured results come back — exit codes, parsed reports, bounded logs. Sandbox output is itself treated as untrusted text if it's ever shown to the LLM (test output can contain injection too).<\/div>\n  <div class=\"qa\"><div class=\"q\">5 · Trusted → External<\/div>GitHub App scopes and branch protection enforce their limits even if every layer above is buggy. Defense in depth, not a single perimeter.<\/div>\n  <div class=\"callout\">A fully adversarial LLM — worst case, the model provider itself is compromised — can at most emit misleading advisory text and burn its rate-limited action budget on allowlisted, revertible actions. It cannot merge a major bump, touch a protected ref, or reach a credential.<\/div>\n`;\n\nconst OVERRIDE_HTML = `\n  <p>Four independent ways to stop or undo the assistant, each with a different latency:<\/p>\n  <table>\n    <tr><th>Control<\/th><th>Effect<\/th><th>Latency<\/th><\/tr>\n    <tr><td><span class=\"mono\">ai-hold<\/span> / <span class=\"mono\">hold<\/span> label on one entity<\/td><td>Freezes all actions on that PR/issue<\/td><td>Next Evaluate call<\/td><\/tr>\n    <tr><td>Repo variable <span class=\"mono\">AI_MAINTAINER_PAUSED=true<\/span><\/td><td>Global halt — in-flight runs stop before their next side effect<\/td><td>≤ one action boundary<\/td><\/tr>\n    <tr><td><span class=\"mono\">workflows.&lt;name&gt;.enabled: false<\/span><\/td><td>Disables one workflow repo-wide<\/td><td>Next run (config re-read)<\/td><\/tr>\n    <tr><td>Suspend the GitHub App installation<\/td><td>Hard platform-level stop — break-glass<\/td><td>Immediate, out-of-band<\/td><\/tr>\n    <tr><td><span class=\"mono\">git revert &lt;SHA from the audit record&gt;<\/span><\/td><td>Undoes any merge<\/td><td>Human speed<\/td><\/tr>\n  <\/table>\n  <p>Every merge is one command away from undone. The audit record for that run has the exact SHA already printed.<\/p>\n`;\n\nconst OBJECTIONS_HTML = `\n  <p>From <b>ARCHITECTURE.md<\/b>'s self-critique — the honest version, not the pitch version.<\/p>\n  <h3>What a Kyverno maintainer would object to<\/h3>\n  <div class=\"qa\"><div class=\"q\">\"Auto-merge is exactly where I'd get burned by a supply-chain attack.\"<\/div>Legitimate. The gate is strictly narrower than current human batch-merging: path allowlist, patch/minor only, groups, rate limit, optional min-age. Every merge is one revert away. Start in approval mode.<\/div>\n  <div class=\"qa\"><div class=\"q\">\"Who maintains the path→suite map?\"<\/div>Honestly the weakest point — the map rots. Mitigated by the unmapped→full-suite fail-safe and a fallback-rate metric that surfaces rot as it happens. Still a real ongoing cost, stated on the roadmap.<\/div>\n  <div class=\"qa\"><div class=\"q\">\"Why not just GitHub's native Dependabot auto-merge?\"<\/div>Native auto-merge can't express path-allowlist verification, group/security-list policy, scoped-test evidence, or audit rationale. Shown, not asserted — that's the DENY demo (the workflow-pin bump).<\/div>\n  <h3>What a security engineer would object to<\/h3>\n  <div class=\"qa\"><div class=\"q\">Privileged DinD for cluster runs<\/div>Acknowledged. Unprivileged for unit runs; VM-per-run is the named production fix; zero credentials inside either way.<\/div>\n  <div class=\"qa\"><div class=\"q\">Audit log is local and mutable<\/div>Hash-chaining is nice-to-have only in the POC. Production wants shipped, append-only storage — conceded on the roadmap, not hidden.<\/div>\n  <h3>What an agent-infra engineer would object to<\/h3>\n  <div class=\"qa\"><div class=\"q\">\"Your MCP layer is in-process Go interfaces, not an actual MCP server.\"<\/div>Correct, and deliberate for the POC — fewer moving parts, same contract. The tool schema is MCP-shaped; serving it over the protocol is a thin adapter, on the roadmap.<\/div>\n  <div class=\"qa\"><div class=\"q\">\"Polling, not webhooks.\"<\/div>POC trigger only — the entrypoint is identical either way.<\/div>\n`;\n\nfunction openDrawer(key){\n  const d = DETAILS[key];\n  if(!d) return;\n  document.getElementById('drawer-eyebrow').textContent = d.eyebrow;\n  document.getElementById('drawer-title').textContent = d.title;\n  document.getElementById('drawer-body').innerHTML = d.body;\n  showDrawer();\n}\nfunction openStatic(eyebrow, title, html){\n  document.getElementById('drawer-eyebrow').textContent = eyebrow;\n  document.getElementById('drawer-title').textContent = title;\n  document.getElementById('drawer-body').innerHTML = html;\n  showDrawer();\n}\nfunction showDrawer(){\n  document.getElementById('drawer').classList.add('open');\n  document.getElementById('backdrop').classList.add('open');\n}\nfunction closeDrawer(){\n  document.getElementById('drawer').classList.remove('open');\n  document.getElementById('backdrop').classList.remove('open');\n}\ndocument.getElementById('drawer-close').addEventListener('click', closeDrawer);\ndocument.getElementById('backdrop').addEventListener('click', closeDrawer);\ndocument.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });\n\ndocument.getElementById('btn-boundary').addEventListener('click', ()=>openStatic('Trust model','Boundary-crossing rules', BOUNDARY_HTML));\ndocument.getElementById('btn-override').addEventListener('click', ()=>openStatic('Control surface','Human override', OVERRIDE_HTML));\ndocument.getElementById('btn-objections').addEventListener('click', ()=>openStatic('Self-critique','Objections', OBJECTIONS_HTML));\n\n/* ---------- fit-to-screen zoom ---------- */\nconst STAGE_W = 1700, STAGE_H = 1040;\nconst canvasScroll = document.getElementById('canvasScroll');\nconst stageSizer = document.getElementById('stageSizer');\nconst stageEl = document.getElementById('stage');\nconst zoomLabel = document.getElementById('zoom-label');\nlet zoom = 1;\nlet fitZoom = 1;\nlet userZoomed = false;\n\nfunction computeFitZoom(){\n  const availW = canvasScroll.clientWidth - 4;   // small breathing margin\n  const availH = canvasScroll.clientHeight - 4;\n  return Math.min(availW / STAGE_W, availH / STAGE_H, 1);\n}\nfunction applyZoom(z, opts){\n  opts = opts || {};\n  zoom = Math.max(fitZoom * 0.4, Math.min(2.5, z));\n  stageEl.style.transform = 'scale(' + zoom + ')';\n  stageSizer.style.width = (STAGE_W * zoom) + 'px';\n  stageSizer.style.height = (STAGE_H * zoom) + 'px';\n  zoomLabel.textContent = Math.round((zoom / fitZoom) * 100) + '%';\n  if(!opts.silent) userZoomed = (Math.abs(zoom - fitZoom) > 0.5);\n}\nfunction fitToScreen(){\n  fitZoom = computeFitZoom();\n  applyZoom(fitZoom, {silent:true});\n  userZoomed = false;\n}\ndocument.getElementById('zoom-in').addEventListener('click', ()=>{ applyZoom(zoom * 1.2); });\ndocument.getElementById('zoom-out').addEventListener('click', ()=>{ applyZoom(zoom / 1.2); });\ndocument.getElementById('zoom-fit').addEventListener('click', fitToScreen);\n\n// ctrl/cmd + wheel to zoom, centered roughly on the cursor\ncanvasScroll.addEventListener('wheel', (e)=>{\n  if(!(e.ctrlKey || e.metaKey)) return;\n  e.preventDefault();\n  const before = zoom;\n  applyZoom(zoom * (e.deltaY < 0 ? 1.1 : 1/1.1));\n  const scaleRatio = zoom / before;\n  canvasScroll.scrollLeft = (canvasScroll.scrollLeft + e.offsetX) * scaleRatio - e.offsetX;\n  canvasScroll.scrollTop = (canvasScroll.scrollTop + e.offsetY) * scaleRatio - e.offsetY;\n}, {passive:false});\n\nwindow.addEventListener('resize', ()=>{\n  const prevFit = fitZoom;\n  fitZoom = computeFitZoom();\n  if(!userZoomed) applyZoom(fitZoom, {silent:true});\n  else zoomLabel.textContent = Math.round((zoom / fitZoom) * 100) + '%';\n});\n\n// initial fit once layout has settled\nrequestAnimationFrame(()=>{ requestAnimationFrame(fitToScreen); });\n<\/script>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  .slide-container {\n    width: 1280px;\n    min-height: 720px;\n    background: #FFFFFF;\n    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;\n    color: #1A1A1A;\n    display: flex;\n    flex-direction: column;\n  }\n  .accent-rule { width: 1280px; height: 3px; background: #D9381E; }\n  .inner { padding: 44px 88px 0 88px; flex: 1; display: flex; flex-direction: column; }\n  .kicker {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 14px; font-weight: 500; letter-spacing: 0.12em;\n    color: #1A1A1A; text-transform: uppercase; margin-bottom: 12px;\n  }\n  .kicker::before {\n    content: \"\";\n    display: inline-block;\n    width: 7px;\n    height: 7px;\n    background: #D9381E;\n    margin-right: 10px;\n    vertical-align: middle;\n    margin-bottom: 2px;\n  }\n  h1 { font-weight: 900; font-size: 46px; line-height: 1.02; letter-spacing: -0.015em; margin-bottom: 28px; }\n  .grid {\n    border: 2px solid #1A1A1A;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n  }\n  .flow { padding: 22px 26px 24px 26px; border: 1px solid #E0E0E0; }\n  .flow .wid {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 13px; font-weight: 700; letter-spacing: 0.14em;\n    color: #D9381E; text-transform: upperca an>two caught bugs that never reached production behavior<\/span><\/div>\n    <div class=\"cases\">\n      <div class=\"case\">\n        <div class=\"c-tag\">Caught in manual code review<\/div>\n        <h3>Malformed GraphQL query — unbalanced braces<\/h3>\n        <p>A GraphQL string embedded in Go — <b>Go's own compiler has no way to validate it<\/b>, so nothing automated would have caught this. Found by hand before it ever reached a real API call, never GitHub's.<\/p>\n      <\/div>\n      <div class=\"case\">\n        <div class=\"c-tag\">Caught and fixed against real behavior<\/div>\n        <h3>CODEOWNERS-parsing bug — union-of-rules semantics<\/h3>\n        <p>The parser assumed <span class=\"mono\">union-of-rules<\/span>; GitHub's actual semantics are <span class=\"mono\">last-match-wins<\/span>. Fixed against <b>real GitHub behavior<\/b> — not against the author's own assumption of what CODEOWNERS does.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>KYVERNO AI MAINTAINER ASSISTANT · LFX MENTORSHIP PROPOSAL<\/span>\n    <span>PAGE 11 / 13<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  .slide-container {\n    width: 1280px;\n    min-height: 720px;\n    background: #FFFFFF;\n    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;\n    color: #1A1A1A;\n    display: flex;\n    flex-direction: column;\n  }\n  .accent-rule { width: 1280px; height: 3px; background: #D9381E; }\n  .inner { padding: 40px 88px 0 88px; flex: 1; display: flex; flex-direction: column; }\n  .kicker {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 14px; font-weight: 500; l font-size: 58px; line-height: 1.0; letter-spacing: -0.02em;\n    margin-bottom: 12px;\n  }\n  .lede {\n    font-size: 17px; line-height: 1.5; color: #333333; max-width: 900px; margin-bottom: 30px;\n  }\n  .lede .mono { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; color: #1A1A1A; }\n\n  .demo {\n    border: 2px solid #1A1A1A;\n    display: flex;\n    align-items: stretch;\n    margin-bottom: 26px;\n  }\n  .demo .dtag {\n    background: #D9381E;\n    color: #FFFFFF;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 13px; font-weight: 700; letter-spacing: 0.14em;\n    text-transform: uppercase;\n    display: flex; align-items: center;\n    padding: 16px 18px; flex-shrink: 0;\n  }\n  .d-item {\n    flex: 1;\n    padding: 18px 22px 18px 22px;\n    border-right: 1px solid #E0E0E0;\n  }\n  .d-item:last-child { border-right: none; }\n  .d-item .n {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12px; font-weight: 700; letter-spacing: 0.1em;\n    text-transform: uppercase; color: #D9381E; margin-bottom: 8px;\n  }\n  .d-item .t {\n    font-weight: 800; font-size: 22px; line-height: 1.2; color: #1A1A1A; margin-bottom: 8px;\n  }\n  .d-item .t .mono { font-family: 'JetBrains Mono', monospace; }\n  .d-item .note {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12.5px; line-height: 1.55; color: #333333;\n  }\n\n  .contact {\n    border: 2px solid #1A1A1A;\n    background: #1A1A1A;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 18px 26px;\n    margin-top: auto;\n  }\n  .contact .side {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 13px; font-weight: 700; letter-spacing: 0.14em;\n    text-transform: uppercase; color: #F28B7A;\n  }\n  .contact .items { display: flex; gap: 40px; }\n  .contact .item {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 17px; font-weight: 500; color: #FFFFFF;\n  }\n  .contact .item span { color: #888888; margin-right: 8px; }\n  .footer {\n    display: flex; justify-content: space-between; align-items: center;\n    padding: 12px 88px 20px 88px; border-top: 1px solid #E0E0E0;\n  }\n  .footer span { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #999999; letter-spacing: 0.06em; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">12 — Closing / What's next<\/div>\n    <h1>The case is built.<br>The demo follows.<\/h1>\n    <div class=\"lede\">What you are about to see is a POC running against real Kyverno infrastructure — not a mock. Three runs, live in the terminal:<\/div>\n\n    <div class=\"demo\">\n      <div class=\"dtag\">Live demo<\/div>\n      <div class=\"d-item\">\n        <div class=\"n\">Run 1<\/div>\n        <div class=\"t\">An <span class=\"mono\">ALLOW<\/span> run<\/div>\n        <div class=\"note\">A patch/minor dependency bump passing classification, scoped tests, policy gate and audit — merged.<\/div>\n      <\/div>\n      <div class=\"d-item\">\n        <div class=\"n\">Run 2<\/div>\n        <div class=\"t\">A <span class=\"mono\">DENY<\/span> run<\/div>\n        <div class=\"note\">The policy layer catches a case GitHub's native Dependabot auto-merge cannot express.<\/div>\n      <\/div>\n      <div class=\"d-item\">\n        <div class=\"n\">Run 3<\/div>\n        <div class=\"t\">A <span class=\"mono\">prompt-injection<\/span> attempt<\/div>\n        <div class=\"note\">The model never gets a chance to act on it — the decision never reaches it.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"contact\">\n      <div class=\"side\">Contact<\/div>\n      <div class=\"items\">\n        <div class=\"item\"><span>email<\/span>amartyatatspandey@gmail.com<\/div>\n        <div class=\"item\"><span>github<\/span>github.com/amartyatatspandey<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>KYVERNO AI MAINTAINER ASSISTANT · LFX MENTORSHIP PROPOSAL<\/span>\n    <span>PAGE 13 / 13<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n"];
const INTERACTIVE = new Set([5]);
const TOTAL = SLIDES.length;
const frame = document.getElementById("frame");
const wrap = document.getElementById("wrap");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const hint = document.getElementById("hint");
const hitPrev = document.getElementById("hitPrev");
const hitNext = document.getElementById("hitNext");
const HINT_DEFAULT = "← → &nbsp; SPACE &nbsp; F FULLSCREEN";
const HINT_LIVE = "CLICK NODES TO EXPLORE · ← → TO CONTINUE · ESC CLOSES DRAWERS";
let index = 0;

function pad(n) {
  return String(n).padStart(2, "0");
}

function parseHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  const n = parseInt(raw, 10);
  if (Number.isFinite(n) && n >= 1 && n <= TOTAL) return n - 1;
  return 0;
}

function isLive(i) {
  return INTERACTIVE.has(i);
}

function fit() {
  if (isLive(index)) {
    wrap.style.width = window.innerWidth + "px";
    wrap.style.height = (window.innerHeight - 36) + "px";
    wrap.style.transform = "none";
    return;
  }
  wrap.style.width = "1280px";
  wrap.style.height = "720px";
  const s = Math.min(window.innerWidth / 1280, (window.innerHeight - 8) / 720);
  wrap.style.transform = "scale(" + s + ")";
}

function bindFrameKeys() {
  try {
    const doc = frame.contentDocument;
    if (!doc) return;
    doc.addEventListener("keydown", function (e) {
      if (e.key === "Escape") return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const nav = ["ArrowRight","ArrowLeft","ArrowDown","ArrowUp","PageDown","PageUp"," ","Home","End","f","F","Backspace"];
      if (nav.indexOf(e.key) === -1) return;
      e.preventDefault();
      handleKey(e.key);
    });
  } catch (err) {}
}

function show(i, pushHash) {
  index = Math.max(0, Math.min(TOTAL - 1, i));
  const live = isLive(index);
  wrap.classList.toggle("live", live);
  hint.innerHTML = live ? HINT_LIVE : HINT_DEFAULT;
  frame.srcdoc = SLIDES[index];
  counter.textContent = "PAGE " + pad(index + 1) + " / " + pad(TOTAL);
  progress.style.width = ((index + 1) / TOTAL * 100) + "%";
  hitPrev.disabled = index === 0;
  hitNext.disabled = index === TOTAL - 1;
  if (pushHash) history.replaceState(null, "", "#" + (index + 1));
  fit();
  if (live) {
    frame.addEventListener("load", bindFrameKeys, { once: true });
  } else {
    window.focus();
  }
}

function next() { show(index + 1, true); }
function prev() { show(index - 1, true); }

function handleKey(key) {
  switch (key) {
    case "ArrowRight":
    case "ArrowDown":
    case "PageDown":
    case " ":
      next();
      break;
    case "ArrowLeft":
    case "ArrowUp":
    case "PageUp":
    case "Backspace":
      prev();
      break;
    case "Home":
      show(0, true);
      break;
    case "End":
      show(TOTAL - 1, true);
      break;
    case "f":
    case "F":
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
  }
}

document.addEventListener("keydown", function (e) {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const nav = ["ArrowRight","ArrowLeft","ArrowDown","ArrowUp","PageDown","PageUp"," ","Home","End","f","F","Backspace"];
  if (nav.indexOf(e.key) === -1) return;
  e.preventDefault();
  handleKey(e.key);
});

hitPrev.addEventListener("click", function () { prev(); this.blur(); });
hitNext.addEventListener("click", function () { next(); this.blur(); });
window.addEventListener("hashchange", function () { show(parseHash(), false); });
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);

fit();
show(parseHash(), true);
</script>
